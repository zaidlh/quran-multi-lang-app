<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>سكينة — غير متصل</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f8f4; color: #173b2e; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 32rem; padding: 2rem; }
      h1 { margin-bottom: .75rem; }
      p { color: #52665b; line-height: 1.8; }
      button { border: 0; border-radius: .75rem; padding: .75rem 1.25rem; background: #0f3d2e; color: white; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>يمكنك العودة إلى الصفحات التي زرتها سابقًا، أو إعادة المحاولة عند عودة الاتصال.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
